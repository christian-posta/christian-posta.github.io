name: "Launch part 3"

# Merges launch/part3 into master and deploys, Mon Nov 2 2026 at 9:00 PM MST.
# Delete this file after the launch, or the cron fires again every Nov 3.
on:
  schedule:
    - cron: "0 4 3 11 *" # 04:00 UTC Tue Nov 3 = 9:00 PM MST Mon Nov 2
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge launch/part3 into master
        run: |
          git config user.name "Christian Posta"
          git config user.email "christian.posta@gmail.com"
          git fetch origin launch/part3
          git merge --no-ff origin/launch/part3 -m "Launch part 3 of credential brokering"
          git push origin master

      # A push made with GITHUB_TOKEN doesn't trigger other workflows,
      # so start the deploy explicitly.
      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref master
